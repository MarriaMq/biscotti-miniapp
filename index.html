<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Biscotti Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/*
  Biscotti brand tokens — generated from brand/design-tokens.md
  Do not hardcode colors/fonts in page files; use these variables.
  Gaps not covered by the brand book (spacing, radius) are project-defined defaults,
  see design-tokens.md "Прогалини" before changing them.
*/

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap');

:root {
  /* Colors — from brand book p.13 */
  --biscotti-grey: #42484C;      /* primary, up to 75% of a layout */
  --biscotti-white: #FFFFFF;     /* secondary, up to 22.5% */
  --biscotti-lemon: #ECE81A;     /* accent line only, never a fill area, max ~2.5% */

  /* Promo red used only for discount stickers — no exact hex in brand book, TBD from Biscotti */
  --biscotti-promo-red: unset;

  /* Semantic aliases for app UI */
  --color-bg: var(--biscotti-grey);
  --color-bg-inverse: var(--biscotti-white);
  --color-text-on-grey: var(--biscotti-white);
  --color-text-on-white: var(--biscotti-grey);
  --color-accent: var(--biscotti-lemon);

  /* Typography */
  --font-base: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-weight-regular: 400;
  --font-weight-bold: 800; /* Montserrat ExtraBold */
  /* Northwell is a paid script font (Fontspring/MyFonts) — requires a web-embedding
     license before use. Not loaded here. Cyrillic glyphs do not exist for it. */
  --font-accent: 'Northwell', cursive;

  /* Spacing / radius — NOT defined in the brand book, project defaults, adjust freely */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --radius-sm: 8px;
  --radius-md: 16px;
}

* { box-sizing: border-box; }

html {
  /* Фолбек, якщо JS (viewport.js) ще не встиг виставити --app-height —
     100dvh враховує адресний рядок мобільного браузера, на відміну від 100vh. */
  --app-height: 100dvh;
  --wave-height: 100dvh;
  /* Фолбек до виклику viewport.js: той самий мінімум, що й у JS (там же
     TODO — повернути до 48/32px, коли буде fullscreen-режим). */
  --safe-top: 8px;
  --safe-bottom: 8px;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--color-bg);
  color: var(--color-text-on-grey);
  font-family: var(--font-base);
}
/* overflow-x лише на html, не на body: якщо задати його й на body теж,
   браузер (за специфікацією overflow) неявно вважає overflow-y на body
   "auto" — body стає власним скрол-контейнером окремо від вікна, і все,
   що прив'язане до скролу вікна (зокрема position: sticky), ламається. */
html {
  overflow-x: hidden;
}

#app { width: 100%; }
.has-phone-preview #app { display: none; }

/* ===== Desktop/dev-only iPhone 14 preview — ніколи не рендериться на
   реальному телефоні чи в Telegram (умова в app.js), не production UI ===== */
.desktop-preview {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  padding: 32px;
  background: #1b1d1f;
}
.iphone-frame {
  width: 390px;
  height: 844px;
  flex-shrink: 0;
  position: relative;
  padding: 14px;
  background: #0c0c0d;
  border-radius: 54px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
}
.iphone-notch {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 26px;
  background: #0c0c0d;
  border-radius: 0 0 16px 16px;
  z-index: 3;
}
.iphone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  background: var(--biscotti-grey);
}
.iphone-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}
.preview-devtools-mount {
  width: 320px;
  max-height: 844px;
  flex-shrink: 0;
  align-self: center;
}
@media (max-width: 900px) {
  .desktop-preview { flex-direction: column; }
  .preview-devtools-mount { width: 390px; }
}

/* ===== ScreenLayout ===== */
.screen-layout {
  position: relative;
  isolation: isolate;
  /* 100dvh напряму, а не var(--app-height): той рахується з
     tg.viewportHeight, і якщо Telegram віддає це число з похибкою
     (спостерігалось на реальному пристрої — контент виглядав нижче
     справжнього центру екрана, бо контейнер був "вищим", ніж видима
     область), верстка ламається без видимої причини. dvh — нативна
     одиниця браузера/WebView, завжди відповідає РЕАЛЬНО видимій висоті. */
  min-height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  /* max() з env() — про запас на випадок, якщо системна виїмка (нотч/острів)
     на цьому пристрої більша за те, що встиг віддати Telegram. */
  padding-top: max(var(--safe-top), env(safe-area-inset-top, 0px));
  padding-bottom: max(var(--safe-bottom), env(safe-area-inset-bottom, 0px));
}

/* Фонова хвиля — окремий абсолютний шар на всю першу екранну висоту.
   Не всередині шапки/форми/лого-блоку, тому не залежить від їхньої висоти
   і не обрізається їхніми контейнерами. */
.brand-wave-layer {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  /* --wave-height (не --app-height!) — стабільна висота, яка не стрибає
     разом із появою клавіатури (див. viewport.js). */
  height: var(--wave-height, var(--app-height));
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.brand-wave-svg { width: 100%; height: 100%; display: block; }

/* prizes: контент довший за один екран, лінія має покривати його цілком
   (включно з тим, що за картками), а не обрізатися на першому viewport. */
.screen-layout--wave-full-content .brand-wave-layer { height: 100%; }

/* Splash: дві лінії домальовуються з невеликим зсувом одна за одною —
   тільки transform-friendly властивості (stroke-dash*, opacity), без
   анімації top/left/width/height.

   Навмисно НЕ обгорнуто в `@media (prefers-reduced-motion: no-preference)`:
   якщо ця медіа-фіча в конкретному WebView не матчиться однозначно (ні
   no-preference, ні reduce), анімація просто ніколи не стартує і лінія/лого
   застрягає в невидимому "from"-стані назавжди. Тому рух — базова
   поведінка, а `reduce` лише вимикає її поверх. */
.screen-layout--animate-wave .wave-path--1 {
  animation: wave-draw 850ms cubic-bezier(.25,.7,.4,1) 150ms both;
}
.screen-layout--animate-wave .wave-path--2 {
  animation: wave-draw 850ms cubic-bezier(.25,.7,.4,1) 350ms both;
}
@media (prefers-reduced-motion: reduce) {
  /* Рух вимкнено — лінії одразу статичні, повністю промальовані. */
  .screen-layout--animate-wave .wave-path--1,
  .screen-layout--animate-wave .wave-path--2 {
    animation: none;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    opacity: 1;
  }
}
@keyframes wave-draw {
  from { stroke-dasharray: 900; stroke-dashoffset: 900; opacity: 1; }
  to { stroke-dasharray: 900; stroke-dashoffset: 0; opacity: 1; }
}

/* ===== Splash: лого — окремий повноекранний шар, центрований незалежно
   від контентної колонки, шапки чи safe-area ===== */
.splash-logo-layer {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  pointer-events: none;
}
.splash-logo-layer__img {
  width: 220px;
  max-width: 55vw;
  filter: brightness(0) invert(1);
  opacity: 0;
  transform: scale(0.97);
  animation: splash-logo-in 420ms cubic-bezier(.2,.7,.3,1) 60ms forwards;
}
@media (prefers-reduced-motion: reduce) {
  .splash-logo-layer__img { animation: splash-logo-in-reduced 200ms ease-out forwards; }
}
@keyframes splash-logo-in {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes splash-logo-in-reduced {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Плавний перехід виходу зі splash (router.js додає/знімає клас) */
.screen-content {
  transition: opacity 200ms ease;
}
.screen-content--fade { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .screen-content { transition: none; }
}

.screen-layout--no-header .app-header { display: none; }

.app-header {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  /* Безпечний відступ уже додано на .screen-layout — тут лише бренд-відступ
     логотипа нижче нього, без повторного підсумовування safe area. */
  padding: var(--space-4) var(--space-3) var(--space-2);
}
.app-header__logo {
  height: 40px;
  width: auto;
  /* Сіре лого на сірому фоні майже не видно — брендбук для сірого фону
     вимагає білий варіант; інвертуємо замість підкладки іншим кольором.
     Файл прозорий (без прямокутної підложки), пропорції не змінюються. */
  filter: brightness(0) invert(1);
}

.screen-content {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  justify-content: center;
}

/* Контентна колонка обмежена по ширині для десктопу/планшета, але фонова
   хвиля й background — full-bleed на весь viewport (не прив'язані до цієї
   ширини). */
.screen {
  width: 100%;
  max-width: 480px;
  padding: var(--space-2) var(--space-3) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* Екрани-результати (виграш/програш/очікування/доставка оформлена):
   заголовок, текст і кнопка — один блок, відцентрований по всій висоті
   екрана (і горизонтально, і вертикально). Нічого не прибивається до
   низу — весь набір елементів завжди посередині. */
.screen--result {
  flex: 1;
  justify-content: center;
  align-items: center;
  text-align: center;
}
.result-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
}
.result-cta {
  margin-top: var(--space-2);
}

.title {
  font-weight: var(--font-weight-bold);
  font-size: 24px;
  margin: 0;
  text-wrap: balance;
}

.subtitle {
  font-weight: var(--font-weight-bold);
  font-size: 16px;
  margin: var(--space-3) 0 0;
}

.body {
  font-weight: var(--font-weight-regular);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
}

.body--muted { opacity: 0.65; font-size: 13px; }

.scroll-box {
  max-height: 40vh;
  overflow-y: auto;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}

.form {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
}

.field__error {
  color: #FF9F45;
  font-size: 12px;
}

input[type="text"], input[type="tel"] {
  width: 100%;
  background: var(--color-bg-inverse);
  color: var(--color-text-on-white);
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  font-family: var(--font-base);
  font-size: 16px; /* 16px мінімум — щоб Safari не зумив при фокусі на iPhone */
}

.code-boxes {
  display: flex;
  gap: 8px;
  justify-content: space-between;
}
.code-box {
  width: 100%;
  min-width: 0;
  aspect-ratio: 1;
  text-align: center;
  font-size: 22px;
  font-weight: var(--font-weight-bold);
  padding: 0;
}
.code-box:focus {
  outline: 2px solid var(--biscotti-lemon);
  outline-offset: 1px;
}

.checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  font-size: 14px;
}
.checkbox-row input { margin-top: 3px; flex-shrink: 0; }

.btn {
  width: 100%;
  min-height: 48px; /* зручна ціль для натискання на телефоні */
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-family: var(--font-base);
  font-weight: var(--font-weight-bold);
  font-size: 15px;
  cursor: pointer;
  white-space: normal;
}

.btn--primary {
  background: var(--color-accent);
  color: var(--biscotti-grey);
  transition: background 160ms ease, color 160ms ease;
}
/* Чистий нейтральний disabled — НЕ opacity на жовтому фоні (це й давало
   брудний жовто-зелений відтінок): суцільний приглушений сірий. */
.btn--primary:disabled {
  background: rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.45);
  cursor: not-allowed;
}

.btn--secondary {
  background: transparent;
  color: var(--color-text-on-grey);
  border: 1px solid rgba(255,255,255,0.4);
}

.link {
  color: var(--color-accent);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  vertical-align: -3px;
}
.link:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.link__icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.row-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-secondary-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  min-height: 46px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.92);
  font-family: var(--font-base);
  font-weight: 500;
  font-size: 14px;
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;
}
.btn-secondary-row:active { background: rgba(255,255,255,0.1); }
.btn-secondary-row__icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  color: var(--biscotti-lemon);
}

.result-badge {
  font-size: 48px;
  line-height: 1;
}

.prize-reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}
.prize-reveal__img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: var(--radius-md);
  border: 2px solid var(--color-accent);
}
.prize-reveal__name {
  font-weight: var(--font-weight-bold);
  font-size: 16px;
  text-align: center;
}

/* ===== Список подарунків: горизонтальні рядки, фото зліва ===== */

/* Каталог довший за один екран — кнопка "Назад" знизу довелось би
   долистувати. Липка кнопка зверху лишається доступною на будь-якій
   позиції скролу, top прив'язаний до safe area, щоб не ховатись під
   системними полями/шапкою Telegram. */
.prizes-topbar {
  position: sticky;
  top: max(var(--safe-top), env(safe-area-inset-top, 0px));
  z-index: 2;
  margin: 0 calc(var(--space-3) * -1);
  padding: 0 var(--space-3) var(--space-2);
}
.prizes-back-top {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--biscotti-grey);
  border: 1px solid rgba(255,255,255,0.24);
  color: var(--color-text-on-grey);
  border-radius: 999px;
  padding: 9px 16px 9px 12px;
  font-family: var(--font-base);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.prizes-back-top svg { width: 16px; height: 16px; flex-shrink: 0; }
.prizes-back-top:active { background: rgba(255,255,255,0.1); }

.prizes-title {
  font-size: 26px;
  font-weight: 800;
  text-align: left;
}

.prize-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.prize-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 11px;
}
.prize-row__img {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08); /* видиме тло, якщо фото не завантажилось */
}
.prize-row__info {
  min-width: 0;
  text-align: left;
}
.prize-row__name {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.3;
}
.prize-row__tier {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-top: 3px;
}

/* ===== Блок гранд-призів — 4 окремі товари ===== */
.grand-prizes {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.grand-prize-card {
  padding: 15px;
  border: 1.5px solid var(--color-accent);
  border-radius: 17px;
  background: var(--color-bg);
  text-align: center;
}
.grand-prize-card__name {
  font-weight: var(--font-weight-bold);
  font-size: 17px;
}
.grand-prize-card__note {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  margin-top: 4px;
}
.grand-prize-card__img {
  width: 140px;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-sm);
  display: block;
  margin: 10px auto 0;
  background: rgba(255,255,255,0.08);
}
.grand-prize-cta {
  margin-top: var(--space-2);
}

.prizes-back-btn {
  margin-top: 16px;
  border-radius: 13px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}
.profile-card__avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--color-accent);
  flex-shrink: 0;
  background: rgba(255,255,255,0.1);
}
.profile-card__info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.profile-card__name {
  font-weight: var(--font-weight-bold);
  font-size: 17px;
  overflow-wrap: break-word;
}
.profile-card__phone {
  font-size: 14px;
  opacity: 0.85;
}
.profile-card__hint {
  font-size: 11px;
  opacity: 0.55;
  margin-top: 4px;
}

.won-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 8px;
}
.won-row__img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.08);
}
.won-row__name { font-weight: var(--font-weight-bold); font-size: 13px; }
.won-row__meta { font-size: 11px; opacity: 0.65; }

/* Скидання тестових даних — доступне поки застосунок ще в тестуванні,
   навмисно приглушене (не яскраво-жовте), щоб не виглядало як основна дія. */
.profile-reset-link {
  background: none;
  border: none;
  color: rgba(255,255,255,0.55);
  font-family: var(--font-base);
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  padding: var(--space-2) 0 0;
  align-self: center;
}

.entry-list { display: flex; flex-direction: column; gap: 6px; }
.entry-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-2);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 13px;
}

.badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; white-space: nowrap; }
.badge--active { background: var(--color-accent); color: var(--biscotti-grey); }
.badge--muted { background: rgba(255,255,255,0.15); }


/* ===== Dev QA panel — тільки при isDev, не входить у продакшн-дизайн ===== */
.devtools {
  background: #111;
  color: #fff;
  font-family: monospace;
  font-size: 12px;
  display: flex;
  flex-direction: column;
}
.devtools--fixed {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  max-height: 60vh;
}
/* Inline-варіант: живе поруч із рамкою iPhone у desktop-прев'ю, а не
   приліплений до низу вікна браузера і не перекриває телефон. */
.devtools--inline {
  position: static;
  border-radius: 16px;
  max-height: 844px;
  overflow: hidden;
}
.devtools--inline .devtools__body { max-height: 800px; }
.devtools__toggle {
  width: 100%;
  padding: 8px;
  background: #000;
  color: var(--biscotti-lemon);
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.devtools__body {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.devtools__label { color: #999; margin-bottom: 4px; }
.devtools__group { display: flex; flex-wrap: wrap; gap: 4px; }
.devtools__group button {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-family: monospace;
  font-size: 11px;
}
.devtools__group button:hover { background: var(--biscotti-lemon); color: #000; }
.devtools__group--codes {
  display: block;
  color: #ccc;
  line-height: 1.6;
}

/* ===== Короткі екрани (розгорнута клавіатура, старі телефони) ===== */
@media (max-height: 640px) {
  .screen { gap: var(--space-2); padding-top: var(--space-1); }
  .splash-logo-layer__img { width: 160px; }
}

body { background: var(--biscotti-grey, #42484C); }
</style>
