    <div class="screen">
      <h1 class="title">Умови акції</h1>
      <div class="body scroll-box">
        <p>1. Організатор акції — ТОВ «БІСКОТТІ» (ЄДРПОУ 38853619).</p>
        <p>2. Період акції: з 00:00 20 жовтня 2026 до 23:59 20 грудня 2026 (за київським часом).</p>
        <p>3. Учасником може бути громадянин(-ка) України, який(-а) досяг(-ла) 18 років, зареєструвався(-лась) у Mini App та ввів(-ла) принаймні один дійсний код з акційної упаковки BISCOTTI.</p>
        <p>4. Кожен дійсний код — окрема участь у миттєвому розіграші та один шанс у фінальному розіграші гранд-призів.</p>
        <p>5. Один учасник може зареєструвати не більше 10 різних дійсних кодів протягом 24 годин.</p>
        <p>6. Фінальний розіграш гранд-призів відбудеться 22 грудня 2026 року серед усіх дійсних кодів, зареєстрованих за час акції.</p>
        <p>7. Переможець зобов'язаний протягом 3 робочих днів з моменту повідомлення надати необхідні дані та документи, інакше право на приз переходить до резервного переможця.</p>
        <p>8. Гранд-приз (тур в Італію) вручається особисто у м. Львові; для переможця з іншого міста Організатор оплачує трансфер до Львова та проживання на одну добу.</p>
        <p>9. Подарунки не обмінюються на грошовий еквівалент.</p>
        <p>10. Беручи участь в акції, учасник підтверджує ознайомлення з цими Правилами та надає згоду на обробку персональних даних в обсязі, необхідному для проведення акції, визначення переможців та вручення подарунків.</p>
