<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Biscotti — Розіграш призів</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
/*
  Biscotti brand tokens — generated from brand/design-tokens.md
  Do not hardcode colors/fonts in page files; use these variables.
  Gaps not covered by the brand book (spacing, radius) are project-defined defaults,
  see design-tokens.md "Прогалини" before changing them.
*/

@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800&display=swap');

:root {
  /* Colors — from brand book p.13 */
  --biscotti-grey: #42484C;      /* primary, up to 75% of a layout */
  --biscotti-white: #FFFFFF;     /* secondary, up to 22.5% */
  --biscotti-lemon: #ECE81A;     /* accent line only, never a fill area, max ~2.5% */

  /* Promo red used only for discount stickers — no exact hex in brand book, TBD from Biscotti */
  --biscotti-promo-red: unset;

  /* Semantic aliases for app UI */
  --color-bg: var(--biscotti-grey);
  --color-bg-inverse: var(--biscotti-white);
  --color-text-on-grey: var(--biscotti-white);
  --color-text-on-white: var(--biscotti-grey);
  --color-accent: var(--biscotti-lemon);

  /* Typography */
  --font-base: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-weight-regular: 400;
  --font-weight-bold: 800; /* Montserrat ExtraBold */
  /* Northwell is a paid script font (Fontspring/MyFonts) — requires a web-embedding
     license before use. Not loaded here. Cyrillic glyphs do not exist for it. */
  --font-accent: 'Northwell', cursive;

  /* Spacing / radius — NOT defined in the brand book, project defaults, adjust freely */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 16px;
  --space-4: 24px;
  --space-5: 32px;
  --radius-sm: 8px;
  --radius-md: 16px;
}

* { box-sizing: border-box; }

html {
  /* Фолбек, якщо JS (viewport.js) ще не встиг виставити --app-height —
     100dvh враховує адресний рядок мобільного браузера, на відміну від 100vh. */
  --app-height: 100dvh;
  --wave-height: 100dvh;
  /* Фолбек до виклику viewport.js: той самий мінімум, що й у JS —
     тепер застосунок працює в fullscreen, тож про запас, а не 8px. */
  --safe-top: 48px;
  --safe-bottom: 32px;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--color-bg);
  color: var(--color-text-on-grey);
  font-family: var(--font-base);
}
/* overflow-x лише на html, не на body: якщо задати його й на body теж,
   браузер (за специфікацією overflow) неявно вважає overflow-y на body
   "auto" — body стає власним скрол-контейнером окремо від вікна, і все,
   що прив'язане до скролу вікна (зокрема position: sticky), ламається. */
html {
  overflow-x: hidden;
}

#app { width: 100%; }
.has-phone-preview #app { display: none; }

/* ===== Desktop/dev-only iPhone 14 preview — ніколи не рендериться на
   реальному телефоні чи в Telegram (умова в app.js), не production UI ===== */
.desktop-preview {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
  padding: 32px;
  background: #1b1d1f;
}
.iphone-frame {
  width: 390px;
  height: 844px;
  flex-shrink: 0;
  position: relative;
  padding: 14px;
  background: #0c0c0d;
  border-radius: 54px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
}
.iphone-notch {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 26px;
  background: #0c0c0d;
  border-radius: 0 0 16px 16px;
  z-index: 3;
}
.iphone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  background: var(--biscotti-grey);
}
.iphone-iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: none;
}
.preview-devtools-mount {
  width: 320px;
  max-height: 844px;
  flex-shrink: 0;
  align-self: center;
}
@media (max-width: 900px) {
  .desktop-preview { flex-direction: column; }
  .preview-devtools-mount { width: 390px; }
}

/* ===== ScreenLayout ===== */
.screen-layout {
  position: relative;
  isolation: isolate;
  /* 100dvh напряму, а не var(--app-height): той рахується з
     tg.viewportHeight, і якщо Telegram віддає це число з похибкою
     (спостерігалось на реальному пристрої — контент виглядав нижче
     справжнього центру екрана, бо контейнер був "вищим", ніж видима
     область), верстка ламається без видимої причини. dvh — нативна
     одиниця браузера/WebView, завжди відповідає РЕАЛЬНО видимій висоті. */
  min-height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  /* max() з env() — про запас на випадок, якщо системна виїмка (нотч/острів)
     на цьому пристрої більша за те, що встиг віддати Telegram. */
  padding-top: max(var(--safe-top), env(safe-area-inset-top, 0px));
  padding-bottom: max(var(--safe-bottom), env(safe-area-inset-bottom, 0px));
}

/* Фонова хвиля — окремий абсолютний шар на всю першу екранну висоту.
   Не всередині шапки/форми/лого-блоку, тому не залежить від їхньої висоти
   і не обрізається їхніми контейнерами. */
.brand-wave-layer {
  position: absolute;
  /* Зсунуто на safe-top: у fullscreen-режимі "плаваючі" кнопки Telegram
     ("Закрити" / ⌄ / •••) лежать НАД контентом у самій верхній
     safe-area-зоні — верхні криві (намальовані близько до y=0 у своєму
     viewBox) інакше опинялись прямо під ними. Зсуваємо весь шар вниз на
     ту саму відстань, що й у .screen-layout, і настільки ж зменшуємо
     висоту, щоб нижній край лишився на місці. */
  top: var(--safe-top, 0px);
  left: 0;
  right: 0;
  /* --wave-height (не --app-height!) — стабільна висота, яка не стрибає
     разом із появою клавіатури (див. viewport.js). */
  height: calc(var(--wave-height, var(--app-height)) - var(--safe-top, 0px));
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}
.brand-wave-svg { width: 100%; height: 100%; display: block; }

/* prizes: контент довший за один екран, лінія має покривати його цілком
   (включно з тим, що за картками), а не обрізатися на першому viewport. */
.screen-layout--wave-full-content .brand-wave-layer { height: calc(100% - var(--safe-top, 0px)); }

/* Splash: дві лінії домальовуються з невеликим зсувом одна за одною —
   тільки transform-friendly властивості (stroke-dash*, opacity), без
   анімації top/left/width/height.

   Навмисно НЕ обгорнуто в `@media (prefers-reduced-motion: no-preference)`:
   якщо ця медіа-фіча в конкретному WebView не матчиться однозначно (ні
   no-preference, ні reduce), анімація просто ніколи не стартує і лінія/лого
   застрягає в невидимому "from"-стані назавжди. Тому рух — базова
   поведінка, а `reduce` лише вимикає її поверх. */
.screen-layout--animate-wave .wave-path--1 {
  animation: wave-draw 850ms cubic-bezier(.25,.7,.4,1) 150ms both;
}
.screen-layout--animate-wave .wave-path--2 {
  animation: wave-draw 850ms cubic-bezier(.25,.7,.4,1) 350ms both;
}
@media (prefers-reduced-motion: reduce) {
  /* Рух вимкнено — лінії одразу статичні, повністю промальовані. */
  .screen-layout--animate-wave .wave-path--1,
  .screen-layout--animate-wave .wave-path--2 {
    animation: none;
    stroke-dasharray: none;
    stroke-dashoffset: 0;
    opacity: 1;
  }
}
@keyframes wave-draw {
  from { stroke-dasharray: 900; stroke-dashoffset: 900; opacity: 1; }
  to { stroke-dasharray: 900; stroke-dashoffset: 0; opacity: 1; }
}

/* ===== Splash: лого — окремий повноекранний шар, центрований незалежно
   від контентної колонки, шапки чи safe-area ===== */
.splash-logo-layer {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  z-index: 2;
  pointer-events: none;
}
.splash-logo-layer__img {
  width: 220px;
  max-width: 55vw;
  filter: brightness(0) invert(1);
  opacity: 0;
  transform: scale(0.97);
  animation: splash-logo-in 420ms cubic-bezier(.2,.7,.3,1) 60ms forwards;
}
@media (prefers-reduced-motion: reduce) {
  .splash-logo-layer__img { animation: splash-logo-in-reduced 200ms ease-out forwards; }
}
@keyframes splash-logo-in {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes splash-logo-in-reduced {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Плавний перехід виходу зі splash (router.js додає/знімає клас) */
.screen-content {
  transition: opacity 200ms ease;
}
.screen-content--fade { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .screen-content { transition: none; }
}

.screen-layout--no-header .app-header { display: none; }

.app-header {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: center;
  /* Безпечний відступ уже додано на .screen-layout — тут лише невеликий
     бренд-відступ логотипа нижче нього (зменшено з space-4: у fullscreen
     safe-top (48px) вже дає достатньо повітря самостійно, зайвий додатковий
     відступ зайве опускав лого нижче кнопки "Закрити"). */
  padding: var(--space-2) var(--space-3) var(--space-2);
}
.app-header__logo {
  height: 40px;
  width: auto;
  /* Сіре лого на сірому фоні майже не видно — брендбук для сірого фону
     вимагає білий варіант; інвертуємо замість підкладки іншим кольором.
     Файл прозорий (без прямокутної підложки), пропорції не змінюються. */
  filter: brightness(0) invert(1);
}

.screen-content {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  justify-content: center;
}

/* Контентна колонка обмежена по ширині для десктопу/планшета, але фонова
   хвиля й background — full-bleed на весь viewport (не прив'язані до цієї
   ширини). */
.screen {
  width: 100%;
  max-width: 480px;
  padding: var(--space-2) var(--space-3) var(--space-5);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

/* Екрани-результати (виграш/програш/очікування/доставка оформлена):
   emoji + заголовок + текст/картинка + кнопка — ОДИН блок (.result-group),
   і саме його вертикальний центр має збігатись з центром робочої області
   (між низом шапки і низом екрана), а не окремі елементи всередині нього.
   justify-content НАВМИСНО flex-start, не center: реальний відступ
   виставляє centerResultBlock() інлайновим margin-top на .result-group
   через виміряні в пікселях значення (див.
   js/components/centerResultBlock.js). Якщо тут лишити center — flexbox
   центрує МАРЖИН-БОКС елемента (тобто враховує і той margin-top, який ми
   щойно порахували, і "розполовинює" його вдруге зверху й знизу) — це і
   спричиняло видиму асиметрію на реальному пристрої навіть після
   правильного розрахунку в JS. */
.screen--result {
  flex: 1;
  justify-content: flex-start;
  align-items: center;
  text-align: center;
  /* Власний top/bottom padding .screen (8px / 32px) інакше конкурував би
     з margin-top, який рахує centerResultBlock() — той рахує відступ від
     СПРАВЖНЬОГО низу шапки/екрана, а не від внутрішніх країв .screen. */
  padding-top: 0;
  padding-bottom: 0;
}
.result-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
}
.result-cta {
  margin-top: var(--space-2);
}

.title {
  font-weight: var(--font-weight-bold);
  font-size: 24px;
  margin: 0;
  text-wrap: balance;
}

.subtitle {
  font-weight: var(--font-weight-bold);
  font-size: 16px;
  margin: var(--space-3) 0 0;
}

.body {
  font-weight: var(--font-weight-regular);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
}

.body--muted { opacity: 0.65; font-size: 13px; }

.scroll-box {
  max-height: 40vh;
  overflow-y: auto;
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}

.form {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 13px;
}

.field__error {
  color: #FF9F45;
  font-size: 12px;
}

/* Поле, під яким може випадати власний список підказок (замість
   ненадійного нативного <datalist> — див. deliveryForm.js). */
.field--relative { position: relative; }
.suggest-box {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  z-index: 5;
  margin-top: 4px;
  background: var(--color-bg-inverse);
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  max-height: 220px;
  overflow-y: auto;
}
.suggest-box__item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  padding: 12px;
  font-family: var(--font-base);
  font-size: 15px;
  color: var(--color-text-on-white);
  cursor: pointer;
}
.suggest-box__item:last-child { border-bottom: none; }
.suggest-box__item:active { background: rgba(0,0,0,0.06); }

input[type="text"], input[type="tel"] {
  width: 100%;
  background: var(--color-bg-inverse);
  color: var(--color-text-on-white);
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  font-family: var(--font-base);
  font-size: 16px; /* 16px мінімум — щоб Safari не зумив при фокусі на iPhone */
}

.code-boxes {
  display: flex;
  gap: 8px;
  justify-content: space-between;
}
.code-box {
  width: 100%;
  min-width: 0;
  aspect-ratio: 1;
  text-align: center;
  font-size: 22px;
  font-weight: var(--font-weight-bold);
  padding: 0;
}
.code-box:focus {
  outline: 2px solid var(--biscotti-lemon);
  outline-offset: 1px;
}

.checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  font-size: 14px;
}
.checkbox-row input { margin-top: 3px; flex-shrink: 0; }

.btn {
  width: 100%;
  min-height: 48px; /* зручна ціль для натискання на телефоні */
  border: none;
  border-radius: var(--radius-sm);
  padding: 14px;
  font-family: var(--font-base);
  font-weight: var(--font-weight-bold);
  font-size: 15px;
  cursor: pointer;
  white-space: normal;
}

.btn--primary {
  background: var(--color-accent);
  color: var(--biscotti-grey);
  transition: background 160ms ease, color 160ms ease;
}
/* Чистий нейтральний disabled — НЕ opacity на жовтому фоні (це й давало
   брудний жовто-зелений відтінок): суцільний приглушений сірий. */
.btn--primary:disabled {
  background: rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.45);
  cursor: not-allowed;
}

.btn--secondary {
  background: transparent;
  color: var(--color-text-on-grey);
  border: 1px solid rgba(255,255,255,0.4);
}

.link {
  color: var(--color-accent);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  /* 0, не -3px: від'ємний зсув штовхав посилання видимо нижче основного
     рядка тексту, коли воно переносилось на свій рядок (напр. в умовах
     акції після довгого речення) — виглядало як "відірване" від тексту. */
  vertical-align: 0;
}
.link:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
  border-radius: 2px;
}
.link__icon {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.row-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-secondary-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  min-height: 46px;
  padding: 8px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,0.92);
  font-family: var(--font-base);
  font-weight: 500;
  font-size: 14px;
  line-height: 1.2;
  white-space: nowrap;
  cursor: pointer;
}
.btn-secondary-row:active { background: rgba(255,255,255,0.1); }
.btn-secondary-row__icon {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  color: var(--biscotti-lemon);
}

.result-badge {
  font-size: 48px;
  line-height: 1;
}

.prize-reveal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
}
.prize-reveal__img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: var(--radius-md);
  border: 2px solid var(--color-accent);
}
.prize-reveal__name {
  font-weight: var(--font-weight-bold);
  font-size: 16px;
  text-align: center;
}

/* ===== Список подарунків: горизонтальні рядки, фото зліва ===== */

/* Каталог довший за один екран — кнопка "Назад" знизу довелось би
   долистувати. Липка кнопка зверху лишається доступною на будь-якій
   позиції скролу, top прив'язаний до safe area, щоб не ховатись під
   системними полями/шапкою Telegram. */
.prizes-topbar {
  position: sticky;
  top: max(var(--safe-top), env(safe-area-inset-top, 0px));
  z-index: 2;
  margin: 0 calc(var(--space-3) * -1);
  padding: 0 var(--space-3) var(--space-2);
}
.prizes-back-top {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--biscotti-grey);
  border: 1px solid rgba(255,255,255,0.24);
  color: var(--color-text-on-grey);
  border-radius: 999px;
  padding: 9px 16px 9px 12px;
  font-family: var(--font-base);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.prizes-back-top svg { width: 16px; height: 16px; flex-shrink: 0; }
.prizes-back-top:active { background: rgba(255,255,255,0.1); }

.prizes-title {
  font-size: 26px;
  font-weight: 800;
  text-align: left;
}

.prize-rows {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.prize-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 11px;
}
.prize-row__img {
  width: 80px;
  height: 80px;
  flex-shrink: 0;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08); /* видиме тло, якщо фото не завантажилось */
}
.prize-row__info {
  min-width: 0;
  text-align: left;
}
.prize-row__name {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.3;
}
.prize-row__tier {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  margin-top: 3px;
}

/* ===== Блок гранд-призів — 4 окремі товари ===== */
.grand-prizes {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.grand-prize-card {
  padding: 15px;
  border: 1.5px solid var(--color-accent);
  border-radius: 17px;
  background: var(--color-bg);
  text-align: center;
}
.grand-prize-card__name {
  font-weight: var(--font-weight-bold);
  font-size: 17px;
}
.grand-prize-card__note {
  font-size: 12px;
  color: rgba(255,255,255,0.65);
  margin-top: 4px;
}
.grand-prize-card__img {
  width: 140px;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-sm);
  display: block;
  margin: 10px auto 0;
  background: rgba(255,255,255,0.08);
}
.grand-prize-cta {
  margin-top: var(--space-2);
}

.prizes-back-btn {
  margin-top: 16px;
  border-radius: 13px;
}

.profile-card {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-md);
  padding: var(--space-3);
}
.profile-card__avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--color-accent);
  flex-shrink: 0;
  background: rgba(255,255,255,0.1);
}
.profile-card__info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.profile-card__name {
  font-weight: var(--font-weight-bold);
  font-size: 17px;
  overflow-wrap: break-word;
}
.profile-card__phone {
  font-size: 14px;
  opacity: 0.85;
}
.profile-card__hint {
  font-size: 11px;
  opacity: 0.55;
  margin-top: 4px;
}

.won-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 8px;
}
.won-row__img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 8px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.08);
}
.won-row__name { font-weight: var(--font-weight-bold); font-size: 13px; }
.won-row__meta { font-size: 11px; opacity: 0.65; }

/* Скидання тестових даних — доступне поки застосунок ще в тестуванні,
   навмисно приглушене (не яскраво-жовте), щоб не виглядало як основна дія. */
.profile-reset-link {
  background: none;
  border: none;
  color: rgba(255,255,255,0.55);
  font-family: var(--font-base);
  font-size: 13px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
  padding: var(--space-2) 0 0;
  align-self: center;
}

.build-tag {
  font-size: 10px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  margin: var(--space-2) 0 0;
}

.entry-list { display: flex; flex-direction: column; gap: 6px; }
.entry-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-2);
  background: rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 13px;
}

.badge { border-radius: 999px; padding: 2px 8px; font-size: 11px; white-space: nowrap; }
.badge--active { background: var(--color-accent); color: var(--biscotti-grey); }
.badge--muted { background: rgba(255,255,255,0.15); }


/* ===== Dev QA panel — тільки при isDev, не входить у продакшн-дизайн ===== */
.devtools {
  background: #111;
  color: #fff;
  font-family: monospace;
  font-size: 12px;
  display: flex;
  flex-direction: column;
}
.devtools--fixed {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  max-height: 60vh;
}
/* Inline-варіант: живе поруч із рамкою iPhone у desktop-прев'ю, а не
   приліплений до низу вікна браузера і не перекриває телефон. */
.devtools--inline {
  position: static;
  border-radius: 16px;
  max-height: 844px;
  overflow: hidden;
}
.devtools--inline .devtools__body { max-height: 800px; }
.devtools__toggle {
  width: 100%;
  padding: 8px;
  background: #000;
  color: var(--biscotti-lemon);
  border: none;
  cursor: pointer;
  flex-shrink: 0;
}
.devtools__body {
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.devtools__label { color: #999; margin-bottom: 4px; }
.devtools__group { display: flex; flex-wrap: wrap; gap: 4px; }
.devtools__group button {
  background: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-family: monospace;
  font-size: 11px;
}
.devtools__group button:hover { background: var(--biscotti-lemon); color: #000; }
.devtools__group--codes {
  display: block;
  color: #ccc;
  line-height: 1.6;
}

/* ===== Короткі екрани (розгорнута клавіатура, старі телефони) ===== */
@media (max-height: 640px) {
  .screen { gap: var(--space-2); padding-top: var(--space-1); }
  .splash-logo-layer__img { width: 160px; }
}

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

  var MockApi = {
    get state() {
      return loadState();
    },
    resetDemo() {
      const fresh = seedState();
      saveState(fresh);
      return fresh;
    },
    acceptConsent() {
      const s = loadState();
      s.user.consentAccepted = true;
      saveState(s);
      return s;
    },
    acceptTerms() {
      const s = loadState();
      s.user.termsAccepted = true;
      saveState(s);
      return s;
    },
    register(fullName, phone) {
      const s = loadState();
      s.user.registered = true;
      s.user.fullName = fullName;
      s.user.phone = phone;
      saveState(s);
      return s;
    },
    /*
      Submits a code. Returns one of:
        { outcome: 'rate_limited' }                             — 10 СПРОБ (будь-яких,
              включно з невалідними — див. коментар нижче) уже за останні 24h
        { outcome: 'invalid' }                                — unknown code
        { outcome: 'already_used' }                             — code entered before
        { outcome: 'lose' }                                      — valid, no instant prize
        { outcome: 'win_instant', prizeTier, prizeItem }          — valid, 'first'/'mid' — reveal now
        { outcome: 'entered_grand_pool' }                          — valid, grand-tagged code;
              per ТЗ розділ 4 це ВІДКРИТЕ ПИТАННЯ — чекаємо фінальний розіграш,
              а не показуємо виграш одразу. INSTANT_REVEAL_FOR_GRAND_CODES
              нижче — перемикач цього рішення.
    */
    submitCode(rawCode) {
      const s = loadState();
      const code = rawCode.trim();
      const nowMs = Date.now();
      const DAY_MS = 24 * 60 * 60 * 1e3;
      s.attempts = (s.attempts || []).filter((t) => nowMs - t < DAY_MS);
      if (s.attempts.length >= 10) {
        s.lastResult = { outcome: "rate_limited" };
        saveState(s);
        return s.lastResult;
      }
      s.attempts.push(nowMs);
      const entry = s.codes[code];
      if (!entry) {
        s.lastResult = { outcome: "invalid" };
        saveState(s);
        return s.lastResult;
      }
      if (entry.status === "used") {
        s.lastResult = { outcome: "already_used" };
        saveState(s);
        return s.lastResult;
      }
      entry.status = "used";
      const newEntry = { code, enteredAt: (/* @__PURE__ */ new Date()).toISOString(), participatedInDraw: false, prizeTier: null, prizeItem: null };
      if (entry.prizeTier === "grand") {
        s.entries.push(newEntry);
        if (INSTANT_REVEAL_FOR_GRAND_CODES) {
          const item = GRAND_ITEM_KEYS[hashCode(code) % GRAND_ITEM_KEYS.length];
          newEntry.prizeTier = "grand";
          newEntry.prizeItem = item;
          s.lastResult = { outcome: "win_instant", prizeTier: "grand", prizeItem: item, code };
        } else {
          s.lastResult = { outcome: "entered_grand_pool", code };
        }
      } else if (entry.prizeTier === "first") {
        newEntry.prizeTier = "first";
        newEntry.prizeItem = "first";
        s.entries.push(newEntry);
        s.lastResult = { outcome: "win_instant", prizeTier: "first", prizeItem: "first", code };
      } else if (entry.prizeTier === "mid") {
        const item = pickMidItem(code);
        newEntry.prizeTier = "mid";
        newEntry.prizeItem = item;
        s.entries.push(newEntry);
        s.lastResult = { outcome: "win_instant", prizeTier: "mid", prizeItem: item, code };
      } else {
        s.entries.push(newEntry);
        s.lastResult = { outcome: "lose" };
      }
      saveState(s);
      return s.lastResult;
    },
    submitDelivery(data) {
      const s = loadState();
      s.lastDelivery = data;
      saveState(s);
      return s;
    },
    /*
      Фінальний розіграш гранд-призів — запускається ОДИН РАЗ, в кінці акції
      (не щотижня). Пул — усі коди, що ще не брали участі в розіграші
      (participatedInDraw === false), тобто кожен зареєстрований код, що
      коли-небудь був введений. З пулу випадково обирається по одному
      переможцю на кожен з 4 гранд-призів (Італія / iPad / iPhone / MacBook).
      Після розіграшу весь пул позначається як "уже брав участь" — кожен код
      має рівно один шанс, а сам розіграш більше не повторюється.
    */
    runFinalDraw() {
      const s = loadState();
      const pool = s.entries.filter((e) => !e.participatedInDraw);
      if (pool.length === 0) {
        s.lastDrawResult = { winners: [], poolSize: 0, note: "\u041D\u0435\u043C\u0430\u0454 \u0443\u0447\u0430\u0441\u043D\u0438\u043A\u0456\u0432 \u0434\u043B\u044F \u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448\u0443" };
        saveState(s);
        return s.lastDrawResult;
      }
      const shuffled = [...pool].sort(() => Math.random() - 0.5);
      const winners = [];
      GRAND_ITEM_KEYS.forEach((itemKey, i) => {
        const winnerEntry = shuffled[i];
        if (!winnerEntry) return;
        winnerEntry.prizeTier = "grand";
        winnerEntry.prizeItem = itemKey;
        winners.push({ code: winnerEntry.code, prizeItem: itemKey });
      });
      pool.forEach((e) => {
        e.participatedInDraw = true;
      });
      s.draws.push({ date: (/* @__PURE__ */ new Date()).toISOString(), pool: pool.map((e) => e.code), winners });
      s.finalDrawDone = true;
      s.lastDrawResult = { winners, poolSize: pool.length };
      saveState(s);
      return s.lastDrawResult;
    }
  };
  var INSTANT_REVEAL_FOR_GRAND_CODES = false;

    const { user } = MockApi.state;

    if (!user.termsAccepted) return navigate("terms");
    if (!user.registered) return navigate("register");
    return navigate("home");

  function onConsentAccepted() {
    MockApi.acceptConsent();
    navigate("terms");

  function onTermsAccepted() {
    MockApi.acceptTerms();
    navigate("register");
  }
  function onRegistered(fullName, phone) {
    MockApi.register(fullName, phone);
    navigate("home");
  }
  function onCodeSubmitted(result) {
    switch (result.outcome) {
      case "rate_limited":
      case "invalid":
      case "already_used":
        return navigate("result-lose", { reason: result.outcome });
      case "lose":
        return navigate("result-lose", { reason: "no_prize" });
      case "win_instant":
        return navigate("result-win", { type: result.prizeTier === "grand" ? "grand" : "code", item: result.prizeItem, code: result.code });
      case "entered_grand_pool":
        return navigate("result-pending", { code: result.code });
      default:
        throw new Error(`Unknown code submit outcome: ${result.outcome}`);
    }
  }

    navigate("result-win", { type: "grand", item });

    navigate("delivery-form", params2);

  function onDeliverySubmitted(formData) {
    MockApi.submitDelivery(formData);
    navigate("delivery-success", { prizeItem: formData.prizeItem });

  // js/phonePreview.js
  function mountPhonePreview() {
    document.body.classList.add("has-phone-preview");
    const wrap = document.createElement("div");
    wrap.className = "desktop-preview";
    wrap.innerHTML = `
    <div class="iphone-frame">
      <div class="iphone-notch"></div>
      <div class="iphone-screen">
        <iframe class="iphone-iframe" title="Biscotti Mini App preview"></iframe>
      </div>
    </div>
    <div class="preview-devtools-mount"></div>
  `;
    document.body.appendChild(wrap);
    const iframe = wrap.querySelector(".iphone-iframe");
    const url = new URL(location.href);
    url.searchParams.set("framed", "1");
    if (!url.hash) url.hash = "#/splash";
    iframe.src = url.toString();
    iframe.addEventListener("load", () => {
      const actions = iframe.contentWindow.__biscottiQA;
      if (!actions) return;
      Promise.resolve().then(() => (init_devtools(), devtools_exports)).then(({ mountDevtools: mountDevtools2 }) => {
        wrap.querySelector(".preview-devtools-mount").innerHTML = "";
        mountDevtools2(actions, { container: wrap.querySelector(".preview-devtools-mount"), fixed: false });
      });
    }, { once: true });
  }

  // js/components/phoneInput.js
  var PREFIX = "+380 ";
  var MAX_DIGITS = 9;
  function initPhoneInput(input) {
    if (!input.value || !input.value.startsWith("+380")) {
      input.value = PREFIX;
    }
    function digitsOf(value) {
      return value.replace(/^\+?380/, "").replace(/\D/g, "").slice(0, MAX_DIGITS);
    }
    function apply(value) {
      const digits = digitsOf(value);
      input.value = PREFIX + digits;
    }
    input.addEventListener("input", () => apply(input.value));
    input.addEventListener("focus", () => {
      if (input.selectionStart < PREFIX.length) {
        const end = input.value.length;
        input.setSelectionRange(end, end);
      }
    });
    input.addEventListener("keydown", (e) => {
      const cursorAtOrBeforePrefix = input.selectionStart <= PREFIX.length && input.selectionEnd <= PREFIX.length;
      if (e.key === "Backspace" && cursorAtOrBeforePrefix) {
        e.preventDefault();
      }
    });
    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData("text");
      apply(pasted);
    });
  }
  function phoneDigits(input) {
    return input.value.replace(PREFIX, "").replace(/\D/g, "");
  }

  // js/components/codeInput.js
  var LENGTH = 6;
  function renderCodeInput(container) {
    container.innerHTML = `
    <div class="code-boxes">
      ${Array.from({ length: LENGTH }, (_, i) => `<input type="text" inputmode="numeric" maxlength="1" class="code-box" data-i="${i}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />`).join("")}
    </div>
  `;
    const boxes = Array.from(container.querySelectorAll(".code-box"));
    boxes.forEach((box) => {
      box.value = "";
    });
    boxes.forEach((box, i) => {
      box.addEventListener("input", () => {
        box.value = box.value.replace(/\D/g, "").slice(0, 1);
        if (box.value && boxes[i + 1]) {
          boxes[i + 1].focus();
        } else if (box.value) {
          box.blur();
        }
      });
      box.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !box.value && boxes[i - 1]) {
          boxes[i - 1].focus();
        }
      });
      box.addEventListener("paste", (e) => {
        e.preventDefault();
        const digits = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, LENGTH);
        digits.split("").forEach((d, j) => {
          if (boxes[j]) boxes[j].value = d;
        });
        const next = boxes[Math.min(digits.length, LENGTH - 1)];
        if (next) next.focus();
      });
    });
    return {
      getValue: () => boxes.map((b) => b.value).join(""),
      focus: () => boxes[0].focus()
    };
  }

  // js/components/centerResultBlock.js
  function centerResultBlock(container) {
    const group = container.querySelector(".result-group");
    if (!group) return;
    const header = document.querySelector(".app-header");
    function apply() {
      const viewportHeight = window.visualViewport?.height || window.innerHeight;
      const headerBottom = header ? header.getBoundingClientRect().bottom : 0;
      const blockHeight = group.getBoundingClientRect().height;
      const desiredTopFromScreenTop = (viewportHeight - blockHeight) / 2;
      const margin = Math.max(0, desiredTopFromScreenTop - headerBottom);
      group.style.marginTop = `${margin}px`;
    }
    apply();
    const img = group.querySelector("img");
    if (img && !img.complete) img.addEventListener("load", apply, { once: true });
    requestAnimationFrame(apply);
    setTimeout(apply, 300);
    setTimeout(apply, 800);
    setTimeout(apply, 1500);
  }

  function isValidFullName(value) {
    const words = value.trim().split(/\s+/).filter(Boolean);
    return words.length >= 2 && words.every((w) => w.length >= 2);
  }
  function isValidTin(value) {
    return /^\d{10}$/.test(value.trim());
  }
  function attachSuggestions(input, getItems) {
    const box = document.createElement("div");
    box.className = "suggest-box";
    box.hidden = true;
    input.insertAdjacentElement("afterend", box);
    function render2() {
      const items = getItems(input.value.trim());
      if (items.length === 0) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      box.innerHTML = items.map((item) => `<button type="button" class="suggest-box__item">${item}</button>`).join("");
      box.hidden = false;
    }
    box.addEventListener("mousedown", (e) => e.preventDefault());
    box.addEventListener("click", (e) => {
      const btn = e.target.closest(".suggest-box__item");
      if (!btn) return;
      input.value = btn.textContent;
      box.hidden = true;
      input.dispatchEvent(new Event("input", { bubbles: true }));
    });
    input.addEventListener("input", render2);
    input.addEventListener("focus", render2);
    input.addEventListener("blur", () => {
      box.hidden = true;
    });
    return { refresh: render2 };
  }

      <h2 class="subtitle">\u041C\u043E\u0457 \u043F\u0440\u0438\u0437\u0438 (${won.length})</h2>
      <div class="entry-list">
        ${won.length === 0 ? '<p class="body body--muted">\u041F\u043E\u043A\u0438 \u0449\u043E \u0431\u0435\u0437 \u0432\u0438\u0433\u0440\u0430\u0448\u0456\u0432 \u2014 \u0432\u0432\u0435\u0434\u0456\u0442\u044C \u043A\u043E\u0434 \u043D\u0430 \u0433\u043E\u043B\u043E\u0432\u043D\u043E\u043C\u0443 \u0435\u043A\u0440\u0430\u043D\u0456.</p>' : won.map((e) => `
          <div class="won-row">
            <img src="${PRIZES[e.prizeItem].img}" alt="${PRIZES[e.prizeItem].name}" class="won-row__img" />
            <div>
              <div class="won-row__name">${PRIZES[e.prizeItem].name}</div>
              <div class="won-row__meta">\u043A\u043E\u0434 ${e.code}${e.prizeTier === "grand" ? " \xB7 \u0433\u0440\u0430\u043D\u0434-\u043F\u0440\u0438\u0437" : ""}</div>
            </div>
          </div>
        `).join("")}
      </div>

      <h2 class="subtitle">\u0423\u0441\u0456 \u043C\u043E\u0457 \u043A\u043E\u0434\u0438 (${entries.length})</h2>
      <div class="entry-list">
        ${entries.length === 0 ? '<p class="body body--muted">\u0412\u0438 \u0449\u0435 \u043D\u0435 \u0432\u0432\u0435\u043B\u0438 \u0436\u043E\u0434\u043D\u043E\u0433\u043E \u043A\u043E\u0434\u0443.</p>' : entries.map((e) => `
          <div class="entry-row">
            <span>${e.code}</span>
            <span class="badge ${e.participatedInDraw ? "badge--muted" : "badge--active"}">
              ${e.participatedInDraw ? "\u0420\u043E\u0437\u0456\u0433\u0440\u0430\u043D\u043E" : "\u041E\u0447\u0456\u043A\u0443\u0454 \u0444\u0456\u043D\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448\u0443"}
            </span>
          </div>
        `).join("")}
      </div>
      <button class="btn btn--secondary" id="back">\u041D\u0430\u0437\u0430\u0434</button>
      <button type="button" class="profile-reset-link" id="reset-demo">\u0421\u043A\u0438\u043D\u0443\u0442\u0438 \u0442\u0435\u0441\u0442\u043E\u0432\u0456 \u0434\u0430\u043D\u0456 \u0439 \u043F\u043E\u0447\u0430\u0442\u0438 \u0437\u0430\u043D\u043E\u0432\u043E</button>
      <p class="build-tag">build ${BUILD_TAG}</p>
    </div>
  `;
    container.querySelector("#back").addEventListener("click", () => navigate("home"));
    container.querySelector("#reset-demo").addEventListener("click", () => {
      const doReset = () => {
        MockApi.resetDemo();
        navigate("splash");
      };
      const tg = window.Telegram?.WebApp;
      const message = "\u0421\u043A\u0438\u043D\u0443\u0442\u0438 \u0432\u0441\u0456 \u0442\u0435\u0441\u0442\u043E\u0432\u0456 \u0434\u0430\u043D\u0456 (\u0440\u0435\u0454\u0441\u0442\u0440\u0430\u0446\u0456\u044E, \u0432\u0432\u0435\u0434\u0435\u043D\u0456 \u043A\u043E\u0434\u0438, \u043F\u0440\u0438\u0437\u0438)? \u041D\u0430\u0441\u0442\u0443\u043F\u043D\u043E\u0433\u043E \u0440\u0430\u0437\u0443 \u0437\u0430\u0441\u0442\u043E\u0441\u0443\u043D\u043E\u043A \u0437\u043D\u043E\u0432\u0443 \u043F\u043E\u043F\u0440\u043E\u0441\u0438\u0442\u044C \u0437\u0430\u0440\u0435\u0454\u0441\u0442\u0440\u0443\u0432\u0430\u0442\u0438\u0441\u044F.";
      if (tg?.showConfirm && tg.initData) {
        tg.showConfirm(message, (ok) => {
          if (ok) doReset();
        });
      } else if (window.confirm(message)) {
        doReset();
      }
    });
  }

  // js/screens/adminDemo.js
  function renderAdminDemo(container) {
    const { entries, draws, finalDrawDone } = MockApi.state;
    const eligibleNow = entries.filter((e) => !e.participatedInDraw);
    container.innerHTML = `
    <div class="screen">
      <h1 class="title">\u0414\u0435\u043C\u043E: \u0444\u0456\u043D\u0430\u043B\u044C\u043D\u0438\u0439 \u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448 \u0433\u0440\u0430\u043D\u0434-\u043F\u0440\u0438\u0437\u0456\u0432</h1>
      <p class="body">\u0421\u0442\u0430\u0442\u0443\u0441: <strong>${finalDrawDone ? "\u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448 \u0443\u0436\u0435 \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u043D\u043E" : "\u0449\u0435 \u043D\u0435 \u043F\u0440\u043E\u0432\u043E\u0434\u0438\u0432\u0441\u044F"}</strong></p>
      <p class="body">\u041A\u043E\u0434\u0438 \u0432 \u043F\u0443\u043B\u0456 \u043D\u0430 \u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448 (\u0449\u0435 \u043D\u0435 \u0431\u0440\u0430\u043B\u0438 \u0443\u0447\u0430\u0441\u0442\u0456): <strong>${eligibleNow.length}</strong></p>
      <div class="entry-list">
        ${eligibleNow.map((e) => `<div class="entry-row"><span>${e.code}</span><span class="badge badge--active">\u0443 \u043F\u0443\u043B\u0456</span></div>`).join("") || '<p class="body body--muted">\u041F\u0443\u043B \u043F\u043E\u0440\u043E\u0436\u043D\u0456\u0439 \u2014 \u0432\u0432\u0435\u0434\u0456\u0442\u044C \u043A\u043E\u0434\u0438 \u043D\u0430 \u0433\u043E\u043B\u043E\u0432\u043D\u043E\u043C\u0443 \u0435\u043A\u0440\u0430\u043D\u0456.</p>'}
      </div>

      <button class="btn btn--primary" id="run-draw" ${finalDrawDone ? "disabled" : ""}>
        ${finalDrawDone ? "\u0420\u043E\u0437\u0456\u0433\u0440\u0430\u0448 \u0443\u0436\u0435 \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u043D\u043E" : "\u0417\u0430\u043F\u0443\u0441\u0442\u0438\u0442\u0438 \u0444\u0456\u043D\u0430\u043B\u044C\u043D\u0438\u0439 \u0440\u043E\u0437\u0456\u0433\u0440\u0430\u0448 (\u0434\u0435\u043C\u043E /run_draw)"}
      </button>

      <h2 class="subtitle">\u041F\u0435\u0440\u0435\u043C\u043E\u0436\u0446\u0456</h2>
      <div class="entry-list">
        ${draws.length === 0 ? '<p class="body body--muted">\u0420\u043E\u0437\u0456\u0433\u0440\u0430\u0448\u0443 \u0449\u0435 \u043D\u0435 \u0431\u0443\u043B\u043E.</p>' : draws.flatMap((d) => d.winners).map((w) => `
          <div class="entry-row">
            <span>${w.code}</span>
            <span class="badge badge--muted">${PRIZES[w.prizeItem]?.name || w.prizeItem}</span>
          </div>
        `).join("")}
      </div>
      <button class="btn btn--secondary" id="back">\u041D\u0430\u0437\u0430\u0434</button>
    </div>
  `;
    container.querySelector("#run-draw").addEventListener("click", () => {
      MockApi.runFinalDraw();
      renderAdminDemo(container);
    });
    container.querySelector("#back").addEventListener("click", () => navigate("home"));
  }

  // js/app.js
  var searchParams = new URLSearchParams(location.search);
  var isFramed = searchParams.get("framed") === "1";
  var PHONE_PREVIEW_BREAKPOINT = 500;
  var wantsPhonePreview = isDev && !isFramed && window.innerWidth > PHONE_PREVIEW_BREAKPOINT;
  var qaActions = {
    navigate,
    onBotStart,
    onGrandPrize: () => onGrandPrizeAnnouncement("grandIpad"),
    reset: () => {
      MockApi.resetDemo();
      navigate("splash");
    }
  };
  if (wantsPhonePreview) {
    mountPhonePreview();
  } else {
    bootApp();
  }
  function bootApp() {
    initViewport();
    registerScreen("splash", (container) => renderSplash(container, {}, { onDone: onBotStart }));
    registerScreen("consent", renderConsent);
    registerScreen("terms", renderTerms);
    registerScreen("register", renderRegister);
    registerScreen("home", renderHome);
    registerScreen("result-win", renderResultWin);
    registerScreen("result-lose", renderResultLose);
    registerScreen("result-pending", renderResultPending);
    registerScreen("prizes", renderPrizes);
    registerScreen("delivery-form", renderDeliveryForm);
    registerScreen("delivery-success", renderDeliverySuccess);
    registerScreen("profile", renderProfile);
    registerScreen("admin-demo", renderAdminDemo);
    window.addEventListener("biscotti:no-route", () => navigate("splash"));
    if (!isDev && location.hash !== "#/splash") {
      history.replaceState(null, "", location.pathname + location.search + "#/splash");
    }
    initRouter(document.getElementById("app"));
    if (isDev) {
      if (isFramed) {
        window.__biscottiQA = qaActions;
      } else {
        mountDevtools(qaActions);
      }
    }
  }
})();

  </script>
</body>
</html>
